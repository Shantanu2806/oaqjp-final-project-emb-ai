<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotion Detector</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          crossorigin="anonymous">
    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
    <style>
        .center-heading {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-body">
            <h1 class="center-heading">NLP - Emotion Detection</h1>
            <div style="padding: 25px;">
                <h2 class="mb-3">
                    <label class="form-label" for="textToAnalyze">
                        Please enter the text to be analyzed
                    </label>
                    <input type="text" class="form-control" id="textToAnalyze">
                </h2>

                <div style="padding: 25px;">
                    <button onclick="RunSentimentAnalysis()"
                            class="btn btn-secondary">
                        Run Emotion Detection
                    </button>
                </div>

                <h2 class="mb-3">
                    <label class="form-label">Result of Emotion Detection</label>
                </h2>

                <div id="system_response" style="padding: 25px;"></div>
            </div>
        </div>
    </div>
</body>
</html>
